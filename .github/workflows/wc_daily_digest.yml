name: WC Daily Digest

# 07:00 UTC = 03:00 ET (EDT) — posted before morning news cycle
# Runs every day during the tournament (June 11 – July 19, 2026)
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:  # allow manual trigger for testing

jobs:
  daily-digest:
    # Bot jobs only run on the upstream repo, which holds the Discord
    # webhook secrets. Without this they fail on every fork and clutter
    # its Actions tab with red X's.
    if: github.repository == 'novaa1351/World-Cup-MVP'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: wcq

    steps:
      - name: Checkout repo (with db file)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: wcq/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download schedule if missing
        run: |
          python src/bot/fixtures.py --download
        env:
          WCQ_SCHEDULE_PATH: data/schedule_2026.json

      - name: Download historical match data
        run: python src/data/historical.py

      - name: Run daily digest
        run: python jobs/daily_digest.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WCQ_DB_PATH:         ${{ secrets.WCQ_DB_PATH || 'wcq_bot.db' }}
          WCQ_SCHEDULE_PATH:   data/schedule_2026.json
          # DRY_RUN: "1"  # uncomment to test without posting

      - name: Commit updated DB back to repo
        # Only commit if the DB file changed (new predictions stored)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f wcq_bot.db 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: daily digest DB update [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
