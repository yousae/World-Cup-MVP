name: WC Post-Match Scorecard

# Runs every 30 minutes. Each run checks for fixtures that finished
# 10–90 minutes ago (match window = kickoff + 2h30m). If a result is
# available from any source, posts the scorecard and settles paper bets.
#
# The 30-minute cadence retries gracefully — results APIs sometimes take
# 15–20 minutes after final whistle to update.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  post-match:
    # Bot jobs only run on the upstream repo, which holds the Discord
    # webhook secrets. Without this they fail on every fork and clutter
    # its Actions tab with red X's.
    if: github.repository == 'novaa1351/World-Cup-MVP'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: wcq

    steps:
      - name: Checkout repo (with db file)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: wcq/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run post-match scorecard
        run: python jobs/post_match.py
        env:
          DISCORD_WEBHOOK_URL:   ${{ secrets.DISCORD_WEBHOOK_URL }}
          WCQ_DB_PATH:           ${{ secrets.WCQ_DB_PATH || 'wcq_bot.db' }}
          WCQ_SCHEDULE_PATH:     data/schedule_2026.json
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          # DRY_RUN: "1"

      - name: Commit updated DB back to repo
        # Commits new results, calibration rows, settled bets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f wcq_bot.db 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: post-match DB update [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
